<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | MechaForge Engineering</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d6f3576e01.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: #050508;
            padding: 40px;
        }
        .admin-view-container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body>
    <div id="auth-check" class="hidden">
        <div class="admin-view-container">
            <div class="admin-header">
                <h2><i class="fas fa-user-shield"></i> Admin Control Center</h2>
                <div class="admin-tabs">
                    <button id="tab-btn-projects" onclick="showTab('projects-tab')" class="btn-secondary active">Projects</button>
                    <button id="tab-btn-settings" onclick="showTab('settings-tab')" class="btn-secondary">General Settings</button>
                </div>
            </div>

            <div id="projects-tab" class="tab-content admin-card">
                <h3><i class="fas fa-plus-circle"></i> Add New Project</h3>
                <div class="upload-form">
                    <div class="input-group">
                        <label>Project Title</label>
                        <input type="text" id="proj-title" placeholder="Project Title">
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <textarea id="proj-desc" placeholder="Project Description"></textarea>
                    </div>
                    <div class="file-inputs grid-2">
                        <div>
                            <label>Media Type</label>
                            <select id="proj-type">
                                <option value="image">Image (PNG/JPG)</option>
                                <option value="video">Video</option>
                            </select>
                        </div>
                        <div>
                            <label>File Upload</label>
                            <input type="file" id="proj-file" accept="image/*,video/*">
                        </div>
                    </div>
                    <button onclick="addProject()" class="btn-primary">Publish to Website</button>
                </div>

                <hr style="margin: 2rem 0; border: 0; border-top: 1px solid var(--glass-border);">
                
                <h3>Current Projects</h3>
                <div id="projects-list-admin" class="projects-list-compact">
                    <!-- Projects will be listed here for deletion -->
                </div>
            </div>

            <div id="settings-tab" class="tab-content hidden admin-card">
                <h3><i class="fas fa-cog"></i> Website Branding</h3>
                <div class="upload-form">
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Company Logo</label>
                            <input type="file" id="settings-logo" accept="image/*">
                        </div>
                        <div class="input-group">
                            <label>Hero Slogan</label>
                            <input type="text" id="settings-slogan">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Contact Email</label>
                            <input type="email" id="settings-email">
                        </div>
                        <div class="input-group">
                            <label>Contact Phone</label>
                            <input type="text" id="settings-phone">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Hero Slideshow Images</label>
                        <input type="file" id="settings-bgs" accept="image/*" multiple>
                    </div>
                    <button onclick="updateSettings()" class="btn-primary">Save Changes</button>
                </div>
            </div>

            <div class="admin-footer">
                <button onclick="exportStaticCode()" class="btn-secondary"><i class="fas fa-code"></i> Export for GitHub</button>
                <button onclick="logoutAdmin()" class="btn-outline">Logout & Exit Dashboard</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="admin-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center; padding:20px;">
        <div style="background:#1a1a2e; padding:30px; border-radius:15px; max-width:800px; width:100%; border:1px solid var(--primary);">
            <h3 style="color:var(--primary);">Static Code for script.js</h3>
            <p style="font-size:0.9rem; margin-bottom:15px;">Copy the code below and replace the first 25 lines of your <b>script.js</b> file.</p>
            <textarea id="export-textarea" style="width:100%; height:300px; background:#050508; color:#0f0; border:1px solid #333; padding:10px; font-family:monospace; font-size:0.8rem;"></textarea>
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button onclick="copyExportCode()" class="btn-primary">Copy Code</button>
                <button onclick="document.getElementById('export-modal').style.display='none'" class="btn-outline">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Check Authentication
        if (localStorage.getItem('ariya_logged_in') !== 'true') {
            alert('Access Denied. Please login first.');
            window.location.href = 'index.html';
        } else {
            document.getElementById('auth-check').classList.remove('hidden');
        }

        let projects = JSON.parse(localStorage.getItem('ariya_projects')) || [];
        let settings = JSON.parse(localStorage.getItem('ariya_settings')) || {};

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.admin-tabs .btn-secondary').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            if (tabId === 'projects-tab') document.getElementById('tab-btn-projects').classList.add('active');
            if (tabId === 'settings-tab') document.getElementById('tab-btn-settings').classList.add('active');
        }

        function renderProjectsList() {
            const list = document.getElementById('projects-list-admin');
            list.innerHTML = '';
            projects.forEach(p => {
                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.padding = '10px';
                item.style.borderBottom = '1px solid var(--glass-border)';
                item.innerHTML = `
                    <span>${p.title}</span>
                    <button onclick="deleteProject(${p.id})" class="btn-outline" style="padding: 2px 10px; font-size: 0.7rem;">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        async function updateSettings() {
            const logoFile = document.getElementById('settings-logo').files[0];
            const slogan = document.getElementById('settings-slogan').value;
            const email = document.getElementById('settings-email').value;
            const phone = document.getElementById('settings-phone').value;
            const bgFiles = document.getElementById('settings-bgs').files;

            if (slogan) settings.slogan = slogan;
            if (email) settings.email = email;
            if (phone) settings.phone = phone;

            const readFile = (file) => new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });

            if (logoFile) settings.logo = await readFile(logoFile);
            if (bgFiles.length > 0) {
                const bgPromises = Array.from(bgFiles).map(file => readFile(file));
                settings.backgrounds = await Promise.all(bgPromises);
            }

            localStorage.setItem('ariya_settings', JSON.stringify(settings));
            alert('Settings Saved Successfully');
        }

        function addProject() {
            const title = document.getElementById('proj-title').value;
            const desc = document.getElementById('proj-desc').value;
            const type = document.getElementById('proj-type').value;
            const fileInput = document.getElementById('proj-file');

            if (!title || !fileInput.files[0]) return alert('Please fill in all fields');

            const reader = new FileReader();
            reader.onload = function(e) {
                projects.push({ id: Date.now(), title, description: desc, type, url: e.target.result });
                localStorage.setItem('ariya_projects', JSON.stringify(projects));
                renderProjectsList();
                alert('Project Added!');
                document.getElementById('proj-title').value = '';
                document.getElementById('proj-desc').value = '';
                fileInput.value = '';
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function deleteProject(id) {
            if (confirm('Delete this project?')) {
                projects = projects.filter(p => p.id !== id);
                localStorage.setItem('ariya_projects', JSON.stringify(projects));
                renderProjectsList();
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('ariya_logged_in');
            window.location.href = 'index.html';
        }

        function exportStaticCode() {
            const projectsData = JSON.stringify(projects, null, 4);
            const settingsData = JSON.stringify(settings, null, 4);
            
            const code = `// --- STATIC DATA START ---
const defaultProjects = ${projectsData};

const defaultSettings = ${settingsData};
// --- STATIC DATA END ---`;

            document.getElementById('export-textarea').value = code;
            document.getElementById('export-modal').style.display = 'flex';
        }

        function copyExportCode() {
            const textarea = document.getElementById('export-textarea');
            textarea.select();
            document.execCommand('copy');
            alert('Code copied! Now paste it into the top of your script.js file.');
        }

        // Init
        document.getElementById('settings-slogan').value = settings.slogan || "";
        document.getElementById('settings-email').value = settings.email || "";
        document.getElementById('settings-phone').value = settings.phone || "";
        renderProjectsList();
    </script>
</body>
</html>
