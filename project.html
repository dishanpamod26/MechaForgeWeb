<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | MechaForge Engineering</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d6f3576e01.js" crossorigin="anonymous"></script>
    <style>
        .details-container {
            padding-top: 100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .full-media {
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
        }
        .project-content {
            max-width: 800px;
            width: 100%;
            background: var(--glass);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            margin-bottom: 3rem;
        }
        .project-content h1 {
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }
        .project-content p {
            font-size: 1.1rem;
            color: var(--text-dim);
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .back-btn {
            margin-bottom: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .back-btn:hover { color: var(--primary); }

        /* Loading spinner */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            min-height: 40vh;
            color: var(--text-dim);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,49,49,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="logo.jpeg" alt="MechaForge Engineering" id="site-logo" style="height: 60px; display: block;">
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Back to Home</a></li>
        </ul>
    </nav>

    <div class="container details-container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Projects</a>

        <div id="project-details">
            <!-- Loading spinner shown while JS runs -->
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading project...</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 MechaForge Engineering. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            const detailsDiv = document.getElementById('project-details');

            if (!projectId) {
                detailsDiv.innerHTML = '<div class="project-content"><h1>No Project Selected</h1><p>Please go back and select a project.</p></div>';
                return;
            }

            // Search in merged projects list
            const projectsList = (typeof getProjects === 'function') ? getProjects() : [];
            let project = projectsList.find(p => p.id == projectId);

            // Fallback to raw static defaultProjects array
            if (!project && typeof defaultProjects !== 'undefined') {
                project = defaultProjects.find(p => p.id == projectId);
            }

            if (project) {
                let mediaHtml = '';
                if (project.type === 'video') {
                    mediaHtml = `<video class="full-media" src="${project.url}" controls autoplay muted loop></video>`;
                } else {
                    mediaHtml = `<img src="${project.url}" alt="${project.title}" class="full-media">`;
                }

                detailsDiv.innerHTML = `
                    ${mediaHtml}
                    <div class="project-content">
                        <h1>${project.title}</h1>
                        <p>${project.description}</p>
                    </div>
                `;
                document.title = `${project.title} | MechaForge Engineering`;
            } else {
                detailsDiv.innerHTML = `
                    <div class="project-content">
                        <h1 style="color:var(--primary)">Project Not Found</h1>
                        <p>The project you are looking for does not exist or may have been removed.</p>
                        <br>
                        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Go back to Home</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
