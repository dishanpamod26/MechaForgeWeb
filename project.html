<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | Ariya Automation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d6f3576e01.js" crossorigin="anonymous"></script>
    <style>
        .details-container {
            padding-top: 120px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .full-media {
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
        }
        .project-content {
            max-width: 800px;
            width: 100%;
            background: var(--glass);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }
        .project-content h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }
        .project-content p {
            font-size: 1.1rem;
            color: var(--text-dim);
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .back-btn {
            margin-bottom: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .back-btn:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="" alt="Ariya Automation" id="site-logo" style="height: 40px; display: none;">
            <div id="text-logo">
                <span class="logo-text">ARIYA</span>
                <span class="logo-subtext">AUTOMATION</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Back to Home</a></li>
        </ul>
    </nav>

    <div class="container details-container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Projects</a>
        
        <div id="project-details">
            <!-- Details will be loaded here -->
            <div class="loading">Loading project details...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Ariya Automation. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        // Use the global getProjects helper from script.js
        const projects = getProjects();
        const project = projects.find(p => p.id == projectId);

        const detailsDiv = document.getElementById('project-details');

        if (project) {
            let mediaHtml = '';
            if (project.type === 'video') {
                mediaHtml = `<video class="full-media" src="${project.url}" controls autoplay muted loop></video>`;
            } else {
                mediaHtml = `<img src="${project.url}" alt="${project.title}" class="full-media">`;
            }

            detailsDiv.innerHTML = `
                ${mediaHtml}
                <div class="project-content">
                    <h1>${project.title}</h1>
                    <p>${project.description}</p>
                </div>
            `;
            document.title = `${project.title} | Ariya Automation`;
        } else {
            detailsDiv.innerHTML = `<h1>Project Not Found</h1><p>The project you are looking for does not exist or has been removed.</p>`;
        }
    </script>
</body>
</html>
